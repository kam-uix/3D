<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        model-viewer {
            width: 100%;
            height: 100%;
        }
    </style>
    <title>Fullscreen Model</title>
</head>

<body>
    <model-viewer id="model-viewer" camera-controls auto-rotate background-color="#000" shadow-intensity="1"></model-viewer>
    <script>
        const params = new URLSearchParams(window.location.search);
        const src = params.get('src');
        if (src) document.getElementById('model-viewer').src = decodeURIComponent(src);
    </script>
</body>

</html>
